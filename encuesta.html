<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta sobre Redes Sociales</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #071a33;
            color: white;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 850px;
            margin: auto;
            background: #0d2748;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .intro {
            text-align: center;
            color: #d9e7f7;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 14px;
        }

        td {
            padding: 5px;
            vertical-align: middle;
        }

        td:first-child {
            width: 38%;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #6685a8;
            border-radius: 8px;
            background: #f7f9fc;
            color: #14263d;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
        }

        input[type="color"] {
            height: 45px;
            padding: 4px;
        }

        input[type="range"] {
            padding: 0;
        }

        .opciones {
            line-height: 2;
        }

        .botones {
            text-align: center;
            padding-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: auto;
            min-width: 120px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: white;
            color: #071a33;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background: #c9d9eb;
        }

        @media (max-width: 650px) {
            .contenedor {
                padding: 20px;
            }

            table,
            tbody,
            tr,
            td {
                display: block;
                width: 100%;
            }

            td:first-child {
                padding-bottom: 4px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Encuesta sobre Redes Sociales</h1>

        <p class="intro">
            Encuesta sobre el uso y la influencia de las redes sociales en los jóvenes.
        </p>

        <form action="" method="post">

            <table>

                <!-- Nombre -->
                <tr>
                    <td>
                        <label for="name">Nombre:</label>
                    </td>

                    <td>
                        <input type="text"
                            placeholder="Coloque su nombre"
                            maxlength="30"
                            required
                            name="name"
                            id="name">
                    </td>
                </tr>

                <!-- Apellido -->
                <tr>
                    <td>
                        <label for="lastname">Apellido:</label>
                    </td>

                    <td>
                        <input type="text"
                            placeholder="Coloque su apellido"
                            name="lastname"
                            id="lastname">
                    </td>
                </tr>

                <!-- Edad -->
                <tr>
                    <td>
                        <label for="age">Edad:</label>
                    </td>

                    <td>
                        <input type="number"
                            placeholder="Edad"
                            min="10"
                            max="25"
                            required
                            name="age"
                            id="age">
                    </td>
                </tr>

                <!-- Correo -->
                <tr>
                    <td>
                        <label for="email">E-mail:</label>
                    </td>

                    <td>
                        <input type="email"
                            placeholder="Correo electrónico"
                            required
                            name="email"
                            id="email">
                    </td>
                </tr>

                <!-- Contraseña -->
                <tr>
                    <td>
                        <label for="password">Contraseña:</label>
                    </td>

                    <td>
                        <input type="password"
                            placeholder="Clave de usuario"
                            maxlength="20"
                            name="password"
                            id="password">
                    </td>
                </tr>

                <!-- Opinión -->
                <tr>
                    <td>
                        <label for="description">
                            ¿Qué opinas de las redes sociales?
                        </label>
                    </td>

                    <td>
                        <textarea
                            name="description"
                            id="description"
                            placeholder="Escribe tu opinión..."
                            rows="5"></textarea>
                    </td>
                </tr>

                <!-- Estudios -->
                <tr>
                    <td>
                        <label for="study">
                            ¿Cuál es tu nivel de estudios?
                        </label>
                    </td>

                    <td>
                        <select name="study" id="study">

                            <option value="">
                                Seleccione una opción
                            </option>

                            <option value="bachillerato">
                                Bachillerato
                            </option>

                            <option value="tecnico">
                                Técnico
                            </option>

                            <option value="universidad">
                                Universidad
                            </option>

                            <option value="otro">
                                Otro
                            </option>

                        </select>
                    </td>
                </tr>

                <!-- Género -->
                <tr>
                    <td>
                        <label>Género:</label>
                    </td>

                    <td class="opciones">

                        <input type="radio"
                            name="gender"
                            value="hombre"
                            id="man">

                        <label for="man">
                            Hombre
                        </label>

                        <input type="radio"
                            name="gender"
                            value="mujer"
                            id="woman">

                        <label for="woman">
                            Mujer
                        </label>

                        <input type="radio"
                            name="gender"
                            value="otro"
                            id="other">

                        <label for="other">
                            Otro
                        </label>

                    </td>
                </tr>

                <!-- Redes sociales -->
                <tr>
                    <td>
                        <label>
                            ¿Qué redes sociales utilizas?
                        </label>
                    </td>

                    <td class="opciones">

                        <input type="checkbox"
                            name="social[]"
                            value="Instagram"
                            id="instagram">

                        <label for="instagram">
                            Instagram
                        </label>

                        <br>

                        <input type="checkbox"
                            name="social[]"
                            value="TikTok"
                            id="tiktok">

                        <label for="tiktok">
                            TikTok
                        </label>

                        <br>

                        <input type="checkbox"
                            name="social[]"
                            value="Facebook"
                            id="facebook">

                        <label for="facebook">
                            Facebook
                        </label>

                        <br>

                        <input type="checkbox"
                            name="social[]"
                            value="YouTube"
                            id="youtube">

                        <label for="youtube">
                            YouTube
                        </label>

                        <br>

                        <input type="checkbox"
                            name="social[]"
                            value="WhatsApp"
                            id="whatsapp">

                        <label for="whatsapp">
                            WhatsApp
                        </label>

                    </td>
                </tr>

                <!-- Color -->
                <tr>
                    <td>
                        <label for="color">
                            ¿Qué color representa mejor tu experiencia en redes?
                        </label>
                    </td>

                    <td>
                        <input type="color"
                            name="color"
                            id="color"
                            value="#071a33">
                    </td>
                </tr>

                <!-- Horas -->
                <tr>
                    <td>
                        <label for="number">
                            ¿Cuántas horas al día utilizas redes sociales?
                        </label>
                    </td>

                    <td>
                        <input type="number"
                            name="hours"
                            id="number"
                            min="0"
                            max="24"
                            placeholder="Ejemplo: 4">
                    </td>
                </tr>

                <!-- Influencia -->
                <tr>
                    <td>
                        <label for="range">
                            ¿Qué tanto influyen las redes en tu vida?
                        </label>
                    </td>

                    <td>

                        <input type="range"
                            name="influence"
                            id="range"
                            min="1"
                            max="10"
                            value="5">

                        <small>
                            1 = Nada &nbsp;&nbsp; 10 = Mucho
                        </small>

                    </td>
                </tr>

                <!-- URL -->
                <tr>
                    <td>
                        <label for="url">
                            Comparte una red social que uses:
                        </label>
                    </td>

                    <td>
                        <input type="url"
                            name="url"
                            id="url"
                            placeholder="https://www.ejemplo.com">
                    </td>
                </tr>

                <!-- Archivo -->
                <tr>
                    <td>
                        <label for="file">
                            Sube una imagen relacionada con las redes sociales:
                        </label>
                    </td>

                    <td>
                        <input type="file"
                            name="file"
                            id="file"
                            accept="image/*">
                    </td>
                </tr>

                <!-- Botones -->
                <tr>
                    <td colspan="2" class="botones">

                        <input type="submit"
                            value="Enviar encuesta">

                        <input type="reset"
                            value="Limpiar">

                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>

</html>
